# 推送（或打 tag）就自动编译 + 发布 GitHub Release，App 内的「检查更新」会读到这个 Release。
#
# 版本号策略（三处必须一致，否则 App 判断不出"有新版"）：
#   BUILD_NO    = 本次运行序号（单调递增）
#   versionCode = 1000 + BUILD_NO      ← App 内比较用的是这个
#   versionName = 1.BUILD_NO           ← 显示给人看
#   tag         = v1.0.(1000+BUILD_NO) ← App 取 tag 最后一段数字，正好等于 versionCode
name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整历史来生成更新内容

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 计算版本号
        id: version
        run: |
          BUILD_NO=${{ github.run_number }}
          CODE=$((1000 + BUILD_NO))
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=1.$BUILD_NO" >> $GITHUB_OUTPUT
          echo "tag=v1.0.$CODE" >> $GITHUB_OUTPUT
          echo "本次版本：1.$BUILD_NO（versionCode $CODE，tag v1.0.$CODE）"

      - name: 编译 release APK
        # updateRepo 决定 App 内「检查更新」去哪个仓库找 Release
        run: |
          gradle assembleRelease --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PupdateRepo=${{ github.repository }}

      - name: 准备发布文件
        run: |
          mkdir -p dist
          # 附件名用纯 ASCII：中文名经 gh 上传后会被吃掉（实测变成了 "-1.1.apk"）
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/timetable-${{ steps.version.outputs.name }}.apk"
          ls -lh dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # 更新内容 = 上次发布以来的提交标题，App 的「发现新版本」弹窗直接显示这段
          PREV=$(git tag --sort=-creatordate | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          NOTES=$(git log --pretty=format:'- %s' "$RANGE" | head -40)
          if [ -z "$NOTES" ]; then NOTES="- 常规更新"; fi
          printf '%s\n\n%s\n' "$NOTES" "(构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，提交 ${GITHUB_SHA:0:7})" > notes.md
          echo "----- 更新内容 -----"; cat notes.md
          gh release create "$TAG" dist/*.apk \
            --title "课程表 $VERSION_NAME" \
            --notes-file notes.md \
          || gh release upload "$TAG" dist/*.apk --clobber
