# 推送（或打 tag）就自动编译 + 发布 GitHub Release，App 内的「检查更新」会读到这个 Release。
#
# 版本号策略：仓库里的 VERSION 文件说了算（例如 1.2）
#   versionName = VERSION              ← App 显示 & 新旧比较都用它
#   versionCode = 主*10000+次*1000+修订 ← 只用于 Android 允许覆盖安装
#   tag         = vVERSION             ← 例如 v1.2
# 发新版时只要改 VERSION 文件（1.2 → 1.3）再 push 即可。
name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整历史来生成更新内容

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2); MINOR=${MINOR:-0}
          PATCH=$(echo "$VERSION" | cut -d. -f3); PATCH=${PATCH:-0}
          # 有 VERSION_CODE 文件时以它为准（保证能覆盖手机上已装的更高 versionCode）
          if [ -f VERSION_CODE ]; then
            CODE=$(cat VERSION_CODE | tr -d '[:space:]')
          else
            CODE=$((MAJOR * 10000 + MINOR * 1000 + PATCH))
          fi
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "本次版本：$VERSION（versionCode $CODE，tag v$VERSION）"

      - name: 检查反馈令牌
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          if [ -n "$FEEDBACK_TOKEN" ]; then
            echo "FEEDBACK_TOKEN 已配置（长度 ${#FEEDBACK_TOKEN}）"
          else
            echo "::warning::FEEDBACK_TOKEN 未配置，App 内的反馈会退回浏览器方式"
          fi

      - name: 编译 release APK
        # updateRepo 决定 App 内「检查更新」去哪个仓库找 Release
        # FEEDBACK_TOKEN 是「反馈问题」直连建 Issue 用的令牌（仓库 secret）
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          gradle assembleRelease --stacktrace \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PupdateRepo=${{ github.repository }}

      - name: 准备发布文件
        run: |
          mkdir -p dist
          # 附件名用纯 ASCII：中文名经 gh 上传后会被吃掉（实测变成了 "-1.1.apk"）
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/timetable-${{ steps.version.outputs.name }}.apk"
          ls -lh dist

      - name: 生成差量补丁
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p prev
          APK="dist/timetable-$VERSION_NAME.apk"
          PATCH="dist/patch-$VERSION_NAME.ttpatch"
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          echo "上一个版本：$PREV"
          if [ -n "$PREV" ]; then
            gh release download "$PREV" --pattern '*.apk' --dir prev 2>/dev/null || true
            OLD=$(ls prev/*.apk 2>/dev/null | head -1 || true)
            if [ -n "$OLD" ]; then
              python3 tools/make_patch.py "$OLD" "$APK" "$PATCH" || rm -f "$PATCH"
            fi
          fi
          if [ -f "$PATCH" ]; then
            python3 tools/make_update_json.py "$VERSION_NAME" "$APK" "$PATCH" > dist/update.json
          else
            python3 tools/make_update_json.py "$VERSION_NAME" "$APK" > dist/update.json
          fi
          cat dist/update.json
          ls -lh dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          # 更新内容 = 上次发布以来的提交标题，App 的「发现新版本」弹窗直接显示这段
          PREV=$(git tag --sort=-creatordate | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          # 过滤掉"未推送/仅本地构建"这类临时字样，发布日志只留改动内容
          NOTES=$(git log --pretty=format:'- %s' "$RANGE" | head -40 \
            | sed -e 's/（仅本地构建，未推送）//g' -e 's/（仅本地构建）//g' -e 's/（未推送）//g')
          if [ -z "$NOTES" ]; then NOTES="- 常规更新"; fi
          printf '%s\n\n%s\n' "$NOTES" "(构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，提交 ${GITHUB_SHA:0:7})" > notes.md
          echo "----- 更新内容 -----"; cat notes.md
          # APK + 差量补丁 + update.json 一起上传
          FILES=$(ls dist/*.apk dist/*.ttpatch dist/update.json 2>/dev/null | tr '\n' ' ')
          echo "上传：$FILES"
          gh release create "$TAG" $FILES \
            --title "课程表 $VERSION_NAME" \
            --notes-file notes.md \
          || gh release upload "$TAG" $FILES --clobber
